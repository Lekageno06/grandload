<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grandload</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel-shell ui-app" aria-labelledby="app-title">
      <header class="panel-header">
        <div class="panel-brand"><span class="panel-logo" aria-hidden="true">G</span><div><p class="panel-kicker">Grandload</p><h1 id="app-title">Grandload</h1><p id="page-domain" class="panel-domain">Page active</p></div></div>
        <span id="app-version" class="panel-version">v…</span>
      </header>
      <section id="status-region" class="panel-status" aria-live="polite">
        <p id="status">Initialisation du panneau…</p>
        <div id="permission-state" hidden></div>
      </section>
      <div id="module-list" class="panel-modules"></div>
      <details id="tasks-panel" class="panel-tasks">
        <summary><span>Tâches</span><span id="task-count" class="ui-badge">0</span></summary>
        <div id="job-list" class="job-list"><p class="ui-muted">Aucune tâche en cours.</p></div>
      </details>
      <div class="panel-action-bar"><span id="panel-selection">Aucune sélection</span><button id="panel-primary-action" class="ui-button ui-button--primary" type="button" disabled>Télécharger</button></div>
    </main>
    <footer class="panel-footer"><small id="build-info"></small></footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
